name: Diagnose Coplan browser shard
on:
  push:
    branches: [verify-coplan-namespace-migration]
permissions:
  contents: read
  statuses: write
jobs:
  reproduce:
    runs-on:
      group: ubuntu-x86-runners
    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/planning_department_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo systemctl start mysql
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/rails db:create db:schema:load
      - name: Run shard
        run: bin/rspec-system-shard 1 4 --seed 60447 --format progress --format json --out tmp/cop-browser-report.json
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          report = pathlib.Path('tmp/cop-browser-report.json')
          data = json.loads(report.read_text()) if report.exists() else {}
          def publish(context, state, value):
              subprocess.run(['gh', 'api', '--method', 'POST',
                f'repos/{os.environ["GITHUB_REPOSITORY"]}/statuses/{os.environ["GITHUB_SHA"]}',
                '-f', 'state='+state, '-f', 'context='+context, '-f', 'description='+value[:136]], check=True)
          failed = [x for x in data.get('examples', []) if x['status'] == 'failed']
          publish('Browser diagnostic summary', 'success' if data and not failed else 'failure', str(data.get('summary_line', 'RSpec did not produce a report')))
          for n, ex in enumerate(failed):
              err = ex.get('exception', {})
              publish(f'Browser diagnostic {n} example', 'failure', f'{ex["file_path"]}:{ex["line_number"]} {err.get("class", "")}')
              for i, line in enumerate(line.strip() for line in err.get('message', '').splitlines()[:8] if line.strip()):
                  publish(f'Browser diagnostic {n} detail {i}', 'failure', line)
          PY
