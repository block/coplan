name: Verify the outline scroll race
on:
  push:
    branches: [verify-coplan-namespace-migration]
permissions:
  contents: read
  statuses: write
jobs:
  outline:
    name: Outline (${{ matrix.guard }})
    runs-on:
      group: ubuntu-x86-runners
    strategy:
      fail-fast: false
      matrix:
        guard: [enabled, disabled]
    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/planning_department_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - run: sudo systemctl start mysql
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/rails db:create db:schema:load
      - if: ${{ matrix.guard == 'disabled' }}
        run: git show HEAD^:engine/app/javascript/controllers/coplan/live_update_controller.js > engine/app/javascript/controllers/coplan/live_update_controller.js
      - name: Run outline regression
        run: bundle exec rspec spec/system/outline_collapse_spec.rb:257 --format progress --format json --out tmp/cop-outline-report.json
      - name: Report regression result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTLINE_GUARD: ${{ matrix.guard }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path('tmp/cop-outline-report.json')
          data = json.loads(path.read_text()) if path.exists() else {}
          failed = [x for x in data.get('examples', []) if x['status'] == 'failed']
          def publish(context, state, description):
              subprocess.run(['gh','api','--method','POST',
                  f'repos/{os.environ["GITHUB_REPOSITORY"]}/statuses/{os.environ["GITHUB_SHA"]}',
                  '-f','state='+state,'-f','context='+context,'-f','description='+description[:136]], check=True)
          label = 'Outline guard ' + os.environ['OUTLINE_GUARD']
          publish(label, 'success' if data and not failed else 'failure', data.get('summary_line', 'No RSpec report'))
          for ex in failed:
              for i, line in enumerate(line.strip() for line in ex.get('exception', {}).get('message', '').splitlines()[:6] if line.strip()):
                  publish(f'{label} failure {i}', 'failure', line)
          PY
