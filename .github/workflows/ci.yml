name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push supersedes older checks on the same PR, but not main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Style only, so it needs no database and no RAILS_ENV. Runs alongside the
  # test jobs rather than gating them: a bracket-spacing nit should not hide
  # whether the suite passes.
  lint:
    # The pinned setup-ruby action provides Ruby 3.4.7 for this image.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bin/rubocop

  # Database, request, service, and other non-browser coverage on both adapters.
  test:
    name: MySQL non-browser
    runs-on:
      group: ubuntu-x86-runners

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/planning_department_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start MySQL
        run: sudo systemctl start mysql

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:schema:load

      - name: Run non-browser tests
        run: bundle exec rspec --exclude-pattern 'spec/system/**/*_spec.rb' --seed "$((GITHUB_RUN_ID % 65536))" --format progress --format json --out tmp/rspec-results.json

      - name: Preserve test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-mysql-${{ github.run_attempt }}
          path: tmp/rspec-results.json
          retention-days: 30

  # Hosts may run the engine on PostgreSQL, so non-browser specs run there too.
  # Browser behavior is covered on MySQL below. Initialize via db:migrate
  # (not schema:load, which MySQL covers) to exercise fresh-host installation;
  # schema.rb is MySQL-flavored.
  test-postgres:
    name: PostgreSQL non-browser
    runs-on:
      group: ubuntu-x86-runners

    env:
      RAILS_ENV: test
      # encoding=unicode overrides database.yml's MySQL-only utf8mb4;
      # SCHEMA keeps the post-migrate dump away from the checked-in schema.rb.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/planning_department_test?encoding=unicode
      PGPASSWORD: test-password-do-not-use
      SCHEMA: tmp/pg_schema.rb

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'test-password-do-not-use';"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:migrate

      # Two invocations: the second proves the seed is idempotent (rake
      # would dedupe a repeated task within one invocation, so it needs to
      # be two commands).
      - name: Install required reference data (idempotency smoke test)
        run: bin/rails coplan:seed && bin/rails coplan:seed

      - name: Run non-browser tests
        run: bundle exec rspec --exclude-pattern 'spec/system/**/*_spec.rb' --seed "$((GITHUB_RUN_ID % 65536))" --format progress --format json --out tmp/rspec-results.json

      - name: Preserve test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-postgres-${{ github.run_attempt }}
          path: tmp/rspec-results.json
          retention-days: 30

  # Each shard gets its own runner/database/browser. Discover files at runtime
  # so new system specs are included automatically, exactly once.
  browser:
    name: MySQL browser (${{ matrix.shard }}/4)
    runs-on:
      group: ubuntu-x86-runners
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/planning_department_test
      SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start MySQL
        run: sudo systemctl start mysql

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:schema:load

      - name: Run browser shard
        run: bin/rspec-system-shard "$SHARD" 4 --seed "$((GITHUB_RUN_ID % 65536))" --format progress --format json --out tmp/rspec-results.json

      - name: Preserve test reports and browser failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-mysql-browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            tmp/rspec-results.json
            tmp/capybara/
            tmp/screenshots/
          retention-days: 30

  # Keep all five randomized repetitions, with each repetition in an isolated
  # job. Keep the regression files together to catch cross-file state leaks.
  browser-stress:
    name: MySQL browser stress (${{ matrix.repetition }})
    runs-on:
      group: ubuntu-x86-runners
    strategy:
      fail-fast: true
      matrix:
        repetition: [0, 1, 2, 3, 4]

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/planning_department_test
      REPETITION: ${{ matrix.repetition }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start MySQL
        run: sudo systemctl start mysql

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:schema:load

      - name: Check browser voice environment cleanup
        if: matrix.repetition == 0
        run: bundle exec rspec spec/system/voice_commenting_spec.rb spec/system/comment_composer_spec.rb --tag voice_environment --order defined --format progress --format json --out tmp/rspec-voice-environment.json

      - name: Stress regression specs with fresh processes and test orders
        run: |
          bin/rspec-stress --runs 1 --seed "$((GITHUB_RUN_ID % 65536 + 1000 + REPETITION))" spec/system/admin_spec.rb spec/system/editor_code_scope_spec.rb spec/system/human_editing_spec.rb spec/system/image_expand_spec.rb spec/system/plan_reviews_spec.rb spec/services/coplan/plans/segment_claims_spec.rb
          bin/rspec-stress --runs 1 --seed "$((GITHUB_RUN_ID % 65536 + 2000 + REPETITION))" --output tmp/rspec-anchor-stress -- spec/system/inline_editor_spec.rb --tag anchor_refresh
          bin/rspec-stress --runs 1 --seed "$((GITHUB_RUN_ID % 65536 + 3000 + REPETITION))" --output tmp/rspec-dense-stress -- spec/system/rich_view_stress_spec.rb --tag dense_cell
          bin/rspec-stress --runs 1 --seed "$((GITHUB_RUN_ID % 65536 + 4000 + REPETITION))" --output tmp/rspec-boundary-stress -- spec/system/human_editing_spec.rb spec/system/inline_editor_spec.rb --tag ci_boundary

      - name: Preserve test reports and browser failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-mysql-stress-${{ matrix.repetition }}-${{ github.run_attempt }}
          path: |
            tmp/rspec-voice-environment.json
            tmp/rspec-stress/
            tmp/rspec-anchor-stress/
            tmp/rspec-dense-stress/
            tmp/rspec-boundary-stress/
            tmp/capybara/
            tmp/screenshots/
          retention-days: 30
