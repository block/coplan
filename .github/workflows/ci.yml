name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Style only, so it needs no database and no RAILS_ENV. Runs alongside the
  # test jobs rather than gating them: a bracket-spacing nit should not hide
  # whether the suite passes.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bin/rubocop

  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/planning_department_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start MySQL
        run: sudo systemctl start mysql

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:schema:load

      - name: Run tests
        run: bundle exec rspec --seed "$((GITHUB_RUN_ID % 65536))" --format progress --format json --out tmp/rspec-results.json

      - name: Stress regression specs with fresh processes and test orders
        run: bin/rspec-stress --runs 5 --seed "$((GITHUB_RUN_ID % 65536 + 1000))" spec/system/admin_spec.rb spec/system/editor_code_scope_spec.rb spec/system/human_editing_spec.rb spec/system/image_expand_spec.rb spec/services/coplan/plans/segment_claims_spec.rb

      - name: Preserve test reports and browser failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-mysql-${{ github.run_attempt }}
          path: |
            tmp/rspec-results.json
            tmp/rspec-stress/
            tmp/capybara/
            tmp/screenshots/
          retention-days: 30

  # Hosts may run the engine on PostgreSQL, so the suite must stay green
  # there too. Deliberately initializes via db:migrate (not schema:load,
  # which the MySQL job covers): replaying every migration on PG is exactly
  # the fresh-host installation path, and schema.rb is MySQL-flavored.
  test-postgres:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      # encoding=unicode overrides database.yml's MySQL-only utf8mb4;
      # SCHEMA keeps the post-migrate dump away from the checked-in schema.rb.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/planning_department_test?encoding=unicode
      PGPASSWORD: test-password-do-not-use
      SCHEMA: tmp/pg_schema.rb

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'test-password-do-not-use';"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:migrate

      # Two invocations: the second proves the seed is idempotent (rake
      # would dedupe a repeated task within one invocation, so it needs to
      # be two commands).
      - name: Install required reference data (idempotency smoke test)
        run: bin/rails coplan:seed && bin/rails coplan:seed

      - name: Run tests
        run: bundle exec rspec --seed "$((GITHUB_RUN_ID % 65536))" --format progress --format json --out tmp/rspec-results.json

      - name: Stress regression specs with fresh processes and test orders
        run: bin/rspec-stress --runs 5 --seed "$((GITHUB_RUN_ID % 65536 + 1000))" spec/system/admin_spec.rb spec/system/editor_code_scope_spec.rb spec/system/human_editing_spec.rb spec/system/image_expand_spec.rb spec/services/coplan/plans/segment_claims_spec.rb

      - name: Preserve test reports and browser failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-postgres-${{ github.run_attempt }}
          path: |
            tmp/rspec-results.json
            tmp/rspec-stress/
            tmp/capybara/
            tmp/screenshots/
          retention-days: 30
